<div class="grid min-h-full place-items-center p-4">
  <div class="w-full max-w-sm rounded-lg bg-white p-8 shadow-sm">
    <div class="mb-8 flex justify-end gap-1.5">
      @for (l of langs; track l) {
        <ui-button size="sm" [variant]="lang.current() === l ? 'primary' : 'secondary'" (click)="lang.set(l)">
          {{ l.toUpperCase() }}
        </ui-button>
      }
    </div>

    <h1 class="mb-2 text-[28px] leading-[34px] font-extrabold text-ink">{{ 'auth.title' | translate }}</h1>
    <p class="mb-7 text-muted">{{ 'auth.sub' | translate }}</p>

    <form [formRoot]="f" novalidate class="flex flex-col gap-4">
      <ui-input kind="phone" [formField]="f.phone" [label]="'auth.phone' | translate" />
      <ui-input kind="password" [formField]="f.password"
        [label]="'auth.pw' | translate" [placeholder]="'auth.pw_ph' | translate" />

      <ui-button type="submit" size="md" block [loading]="f().submitting()">
        {{ 'auth.btn' | translate }}
      </ui-button>
    </form>
  </div>
</div>
